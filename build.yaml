# This file generates the GitHub Actions matrix.
# For simple board + shield combinations, add them to the top level board and
# shield arrays, for more control, add individual board + shield combinations
# to the `include` property. You can also use the `cmake-args` property to
# pass flags to the build command, `snippet` to add a Zephyr snippet, and
# `artifact-name` to assign a name to distinguish build outputs from each other.
#
---
include:

  # =========================================================================
  # LEFT (CENTRAL) BUILDS - 4 Options
  # =========================================================================

  # 1. Left: Encoder (No Studio)
  - board: nice_nano@2.0.0//zmk
    shield: ergo_nano_left nice_view ergo_nano_encoder
    artifact-name: ergo_nano_left_encoder

  # 2. Left: Encoder + ZMK Studio
  - board: nice_nano@2.0.0//zmk
    shield: ergo_nano_left nice_view ergo_nano_encoder
    snippet: studio-rpc-usb-uart
    cmake-args: -DCONFIG_ZMK_STUDIO=y
    artifact-name: ergo_nano_left_encoder_studio

  # 3. Left: RGB LED (No Studio)
  - board: nice_nano@2.0.0//zmk
    shield: ergo_nano_left nice_view ergo_nano_led ergo_nano_left_rgb
    artifact-name: ergo_nano_left_led

  # 4. Left: RGB LED + ZMK Studio
  - board: nice_nano@2.0.0//zmk
    shield: ergo_nano_left nice_view ergo_nano_led ergo_nano_left_rgb
    snippet: studio-rpc-usb-uart
    cmake-args: -DCONFIG_ZMK_STUDIO=y
    artifact-name: ergo_nano_left_led_studio

  # =========================================================================
  # RIGHT (PERIPHERAL) BUILDS - 2 Options
  # Note: Peripherals do not run Studio RPC; they pair with any left build
  # =========================================================================

  # Right: Encoder
  - board: nice_nano@2.0.0//zmk
    shield: ergo_nano_right nice_view ergo_nano_encoder
    artifact-name: ergo_nano_right_encoder

  # Right: RGB LED
  - board: nice_nano@2.0.0//zmk
    shield: ergo_nano_right nice_view ergo_nano_led ergo_nano_right_rgb
    artifact-name: ergo_nano_right_led

  # =========================================================================
  # SETTINGS RESET
  # =========================================================================
  - board: nice_nano@2.0.0//zmk
    shield: settings_reset
    artifact-name: settings_reset
